<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" data-palette="e656c0-e76a83-eeacf6-6bc3d1c46b53" role="img" aria-labelledby="el-pn-d-title el-pn-d-desc"><title id="el-pn-d-title">ErgoLab panel and artifacts</title><desc id="el-pn-d-desc">The driver panel around one suite, and the report, JSON and badge artifacts a run writes.</desc>
