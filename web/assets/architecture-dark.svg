<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.el-ar-d-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.el-ar-d-flow{animation:el-ar-d-fdash 5.5s linear infinite}@keyframes el-ar-d-fdash{to{stroke-dashoffset:-180}}.el-ar-d-pulse{animation:el-ar-d-fpulse 4.2s ease-in-out infinite}@keyframes el-ar-d-fpulse{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style>
