<line x1="36" y1="386" x2="964" y2="386" stroke="#3a1837"/>
<text x="36" y="412" fill="#b29cbd" font-size="11.5" font-weight="600" class="el-ar-d-mono">driver interface: detect() · buildInvocation(task, sandbox) · parseUsage(rawOutput) — the only extension point</text>
