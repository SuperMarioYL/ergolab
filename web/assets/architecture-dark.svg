<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" data-palette="e656c0-e76a83-eeacf6-6bc3d1c46b53" role="img" aria-labelledby="el-ar-d-title el-ar-d-desc"><title id="el-ar-d-title">ErgoLab architecture</title><desc id="el-ar-d-desc">One binary, no services: the suite file through SuiteLoader and Runner to four drivers and the Reporter artifacts.</desc>
<defs>
